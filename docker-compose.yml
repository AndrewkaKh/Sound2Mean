services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DJANGO_DEBUG: "1"
      TELEGRAM_PROXY: "${TELEGRAM_PROXY:-}"
      NO_PROXY: "localhost,127.0.0.1,web,bot"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  bot:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_PROXY: "${TELEGRAM_PROXY:-}"
      NO_PROXY: "localhost,127.0.0.1,web,bot"
    command: python manage.py run_telegram_bot
    depends_on:
      - web